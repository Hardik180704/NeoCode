    <rect x="694" y="146" width="506" height="397" fill="url(#scene-shade)"/>
  </g>
  <path d="M724 146h476v397H724a30 30 0 0 1-30-30V176a30 30 0 0 1 30-30Z" fill="none" stroke="#89b4fa" stroke-opacity=".27"/>

