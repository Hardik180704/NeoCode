  <path d="m95-160 150-15 76 775-150 15Z" fill="url(#beam-a)"/>
  <path d="m485-170 145 26-136 766-145-26Z" fill="url(#beam-b)"/>

  <image href="favicon.svg" x="58" y="46" width="50" height="50"/>
  <text x="127" y="81" class="ascii" fill="#8290aa" font-size="25">NEO</text>
  <text x="184" y="81" class="ascii" fill="#f3f7ff" font-size="25">CODE</text>
  <text x="1142" y="76" class="mono" fill="#7f91ad" font-size="9" letter-spacing="1.3" text-anchor="end">OPEN-SOURCE TERMINAL CODING AGENT</text>

  <text x="62" y="179" class="mono" fill="#56d6c2" font-size="10" font-weight="700" letter-spacing="1.4">OPEN-SOURCE TERMINAL CLIENT</text>
  <text x="58" y="260" class="sans" fill="#f3f7ff" font-size="64" font-weight="500" letter-spacing="-4">Code with NeoCode.</text>
  <text x="58" y="321" class="sans" fill="#b8c7dc" font-size="64" font-weight="500" letter-spacing="-4">Stay in your terminal.</text>
  <text x="62" y="372" class="sans" fill="#9caac0" font-size="18">Ask questions, inspect files, plan changes, and build</text>
  <text x="62" y="400" class="sans" fill="#9caac0" font-size="18">without leaving your terminal.</text>

