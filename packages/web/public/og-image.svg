    <text x="122" y="122" class="ascii" fill="#8290aa" font-size="23">NEO</text>
    <text x="177" y="122" class="ascii" fill="#f3f7ff" font-size="23">CODE</text>
    <rect x="25" y="154" width="397" height="101" rx="11" fill="#111214"/>
    <rect x="25" y="154" width="2" height="101" fill="#56d6c2"/>
    <rect x="45" y="176" width="7" height="17" fill="#f8f8fa"/>
    <text x="55" y="189" class="mono" fill="#74747b" font-size="10">Find where failed payments are retried</text>
    <text x="45" y="222" class="mono" fill="#56d6c2" font-size="9">Build</text>
    <text x="81" y="222" class="mono" fill="#34343a" font-size="9">›</text>
    <text x="94" y="222" class="mono" fill="#e4e4e8" font-size="9">claude-opus-4-6</text>
