<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      @font-face {
        font-family: "Sixtyfour OG";
        src: url("data:font/woff2;base64,");
      }
      .ascii { font-family: "Sixtyfour OG", monospace; font-variation-settings: "BLED" 2, "SCAN" -12; }
      .mono { font-family: "Courier New", monospace; }
      .sans { font-family: Arial, Helvetica, sans-serif; }
    </style>
    <linearGradient id="beam-a" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#56d6c2" stop-opacity="0"/>
      <stop offset=".5" stop-color="#56d6c2" stop-opacity=".09"/>
      <stop offset="1" stop-color="#56d6c2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam-b" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#89b4fa" stop-opacity="0"/>
      <stop offset=".5" stop-color="#89b4fa" stop-opacity=".075"/>
      <stop offset="1" stop-color="#89b4fa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scene-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#071327" stop-opacity=".2"/>
      <stop offset="1" stop-color="#040b1b" stop-opacity=".72"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#89b4fa" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="scene-clip"><path d="M724 146h476v397H724a30 30 0 0 1-30-30V176a30 30 0 0 1 30-30Z"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="#040b1b"/>
