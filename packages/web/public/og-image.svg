    <rect x="127" y="438" width="61" height="28" rx="14" fill="#071327" stroke="#89b4fa" stroke-opacity=".28"/>
    <text x="157.5" y="456" fill="#89b4fa" text-anchor="middle">BUILD</text>
    <rect x="196" y="438" width="77" height="28" rx="14" fill="#071327" stroke="#89b4fa" stroke-opacity=".28"/>
    <text x="234.5" y="456" fill="#89b4fa" text-anchor="middle">NEOLENS</text>
  </g>

